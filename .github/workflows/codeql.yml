name: CodeQL

# Static analysis for the JavaScript/TypeScript surface. Wires ADR-0007
# criterion 7 (security + honest framing) and the Phase α exit checklist
# item for supply-chain + source-code hygiene. Weekly cron catches CVE
# query updates that land in CodeQL packs between PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 8 * * 1" # Weekly, Monday 08:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # CodeQL writes scan results back into the repo Security tab.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended bumps coverage beyond the default query
          # pack; security-and-quality adds maintainability smells too,
          # which is useful signal for a portfolio project.
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
