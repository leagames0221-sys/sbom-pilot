name: CodeQL

# Static analysis for the JavaScript/TypeScript surface. Wires ADR-0007
# criterion 7 (security + honest framing) and the Phase α exit checklist
# item for supply-chain + source-code hygiene. Weekly cron catches CVE
# query updates that land in CodeQL packs between PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 8 * * 1" # Weekly, Monday 08:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # CodeQL writes scan results back into the repo Security tab.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Check repo visibility
        # Code Scanning (CodeQL upload destination) is only available on
        # PUBLIC repositories (or with GHAS on private). When the repo is
        # still PRIVATE (pre-Phase α exit), short-circuit the job with a
        # logged skip so the Actions tab stays green and the workflow
        # auto-activates on PUBLIC flip with no edits needed.
        id: visibility
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Repository is private; Code Scanning requires PUBLIC visibility (or GHAS)."
            echo "Workflow is configured and ready; CodeQL SARIF will publish on PUBLIC flip with no further changes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.visibility.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: steps.visibility.outputs.skip != 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended bumps coverage beyond the default query
          # pack; security-and-quality adds maintainability smells too,
          # which is useful signal for a portfolio project.
          queries: security-extended,security-and-quality

      - name: Autobuild
        if: steps.visibility.outputs.skip != 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.visibility.outputs.skip != 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
